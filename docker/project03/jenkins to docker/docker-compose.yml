version: '3'
services:
  mysql:
    image: mysql:8.0
    container_name: ORSProject_03_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: project03
    ports:
      - "3308:3306"
    networks:
      - mynetwork
    volumes:
      - ./mysql-data:/var/lib/mysql

  webapp:
    build:
      context: .
    container_name: ORSProject__03_webapp
    ports:
      - "8080:8080"
    networks:
      - mynetwork
    depends_on:
      - mysql
    environment:
      - DATABASE_URL=jdbc:mysql://mysql:3306/project03
networks:
  mynetwork:
    driver: bridge